<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="description" content="実戦に出てくる局面の詰将棋を、将棋エンジン相手に解く" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/noto-serif-jp-pieces.woff2" as="font" type="font/woff2" crossorigin />
    <title>実戦詰将棋</title>
    <script>
      // 見張り: Service Worker がキャッシュから返したページで、アプリが起動しなかったときの逃げ道。
      // キャッシュのページを消してネットから読み込み直す（1回だけ）。'app-v1' と '/' は public/sw.js の APP_CACHE と PAGE
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        setTimeout(function () {
          if (window.__started || sessionStorage.getItem('tsume.pageRetry')) return;
          sessionStorage.setItem('tsume.pageRetry', '1');
          caches.open('app-v1').then(function (c) { return c.delete('/'); }).finally(function () { location.reload(); });
        }, 8000);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
